name: Retry iOS once (2026-10-22 03:00 SGT)

# Remove this file after the retry. The date guard prevents future-year retries.
on:
  schedule:
    # 2026-10-22 03:00 Asia/Singapore = 2026-10-21 19:00 UTC.
    - cron: '0 19 21 10 *'

permissions:
  actions: write

concurrency:
  group: retry-ios-once-39604189127
  cancel-in-progress: false

jobs:
  retry-ios:
    if: github.repository == 'maotsuai/s1er'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retry the failed iOS job on agent/swiping-refac
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta, timezone
          from urllib.request import Request, urlopen
          
          now = datetime.now(timezone.utc)
          singapore = timezone(timedelta(hours=8))
          if (now.astimezone(singapore).date().isoformat() != "2026-10-22"
                  or now < datetime(2026, 10, 21, 19, tzinfo=timezone.utc)):
              print("Outside the one-time retry date; skipping.")
              raise SystemExit(0)
          
          repository = "maotsuai/s1er"
          run_id = 39604189127
          expected_sha = "914c0e49af6050226d97bdb6e4f6d78f5bcbecea"
          if os.environ["GITHUB_REPOSITORY"] != repository:
              raise SystemExit("This retry is only for maotsuai/s1er.")
          
          def api(path, method="GET"):
              request = Request(
                  f"https://api.github.com/repos/{repository}/{path}",
                  data=b"{}" if method == "POST" else None,
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
                  method=method,
              )
              with urlopen(request, timeout=30) as response:
                  body = response.read()
                  return json.loads(body) if body else None
          
          run = api(f"actions/runs/{run_id}")
          if (run["head_branch"] != "agent/swiping-refac"
                  or run["head_sha"] != expected_sha
                  or run["event"] != "workflow_dispatch"
                  or run["path"] != ".github/workflows/build.yml"):
              raise SystemExit("Target run no longer matches the expected branch and commit.")
          if run["status"] != "completed":
              print("Target run is already active; skipping.")
              raise SystemExit(0)
          
          jobs = api(f"actions/runs/{run_id}/jobs?filter=latest&per_page=100")["jobs"]
          ios_jobs = [job for job in jobs if job["name"] == "Build ios"]
          if len(ios_jobs) != 1:
              raise SystemExit("Expected exactly one iOS job.")
          job = ios_jobs[0]
          if job["conclusion"] == "success":
              print("iOS already succeeded; skipping.")
              raise SystemExit(0)
          if job["status"] != "completed" or job["conclusion"] not in {
              "failure", "cancelled", "timed_out", "startup_failure"
          }:
              raise SystemExit("iOS job is not in a retryable state.")
          
          api(f"actions/jobs/{job['id']}/rerun", method="POST")
          print(f"Requested iOS retry: https://github.com/{repository}/actions/runs/{run_id}")
          PY
